<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E51C23" />
    <title>FixNGo</title>
    <script>
      // Apply persisted theme/lang before first paint (no flash).
      (function () {
        var t = localStorage.getItem('fixngo.theme') || 'light';
        var l = localStorage.getItem('fixngo.lang') || 'en';
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
    <script>
      // UI protection guard (matches tt.nerot.me while keeping Copy & Paste enabled in fields)
      (function () {
        'use strict';
        var isEditable = function (el) {
          return !!(el && el.closest && el.closest('input, textarea, [contenteditable="true"], .allow-select'));
        };

        // 1) Block context menu & right-click inspect trigger
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, true);
        document.addEventListener('mousedown', function (e) {
          if (e.button === 2) e.preventDefault();
        }, true);

        // 2) Prevent text selection on app UI (allow inside inputs/textareas when not drag-scrolling; copy & paste remain allowed)
        document.addEventListener('selectstart', function (e) {
          if (document.documentElement.getAttribute('data-phone-dragging') === '1') {
            e.preventDefault();
            return;
          }
          if (isEditable(e.target)) return;
          e.preventDefault();
        }, true);

        // 3) Prevent element/image/link ghost dragging
        document.addEventListener('dragstart', function (e) { e.preventDefault(); }, true);

        // 4) Block DevTools / View-Source / Save / Print shortcuts & full-page Ctrl+A outside inputs
        document.addEventListener('keydown', function (e) {
          var k = String(e.key || '');
          var upper = k.toUpperCase();
          var lower = k.toLowerCase();
          var ctrl = e.ctrlKey || e.metaKey;
          var fnBlocked = /^F(12|11|10|9)$/i.test(k);
          var devCombo =
            (ctrl && e.shiftKey && ['I', 'J', 'C', 'K'].indexOf(upper) !== -1) ||
            (e.metaKey && e.altKey && ['I', 'J', 'C', 'U'].indexOf(upper) !== -1);
          var pageCombo = ctrl && ['u', 's', 'p'].indexOf(lower) !== -1;
          if (fnBlocked || devCombo || pageCombo) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          if (ctrl && lower === 'a' && !isEditable(e.target)) {
            e.preventDefault();
          }
        }, true);

        // 5) Blank output if print is triggered from browser menu
        window.addEventListener('beforeprint', function () {
          if (document.getElementById('print-guard')) return;
          var d = document.createElement('style');
          d.id = 'print-guard';
          d.textContent = '#root { visibility: hidden !important; }';
          document.head.appendChild(d);
        });
        window.addEventListener('afterprint', function () {
          var d = document.getElementById('print-guard');
          if (d) d.remove();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
